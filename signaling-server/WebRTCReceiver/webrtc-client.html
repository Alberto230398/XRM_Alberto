<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebRTC Receiver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    width: 100vw; height: 100vh;
  }

  #video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
  }

  /* self-view (webcam locale inviata al Quest): piccolo riquadro in basso a destra */
  #localVideo {
    position: fixed; right: 14px; bottom: 64px;
    width: 220px; max-width: 30vw;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border: 1px solid #333;
    background: #111;
    transform: scaleX(-1);   /* effetto specchio, come ci si aspetta da una self-view */
    display: none;           /* mostrato quando la webcam locale è attiva */
    z-index: 5;
  }

  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #2a2a2a; font-size: 0.85rem; letter-spacing: 0.25em;
    font-family: 'Courier New', monospace; text-transform: uppercase;
    pointer-events: none;
    background: #000;
  }

  /* controlli flottanti, visibili solo sull'hover */
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 10px; align-items: center; justify-content: center;
    padding: 14px 20px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    opacity: 0;
    transition: opacity 0.25s;
    font-family: 'Courier New', monospace;
  }
  body:hover #controls { opacity: 1; }

  input {
    background: rgba(20,20,20,0.9); border: 1px solid #333; color: #ccc;
    padding: 5px 9px; font-family: inherit; font-size: 0.75rem;
    width: 230px;
  }
  input.short { width: 130px; }

  button {
    background: none; border: 1px solid #555; color: #999;
    padding: 5px 14px; font-family: inherit; font-size: 0.75rem;
    cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase;
    transition: border-color 0.2s, color 0.2s;
  }
  button:hover { border-color: #aaa; color: #fff; }
  button:disabled { opacity: 0.3; cursor: default; }

  #status {
    font-size: 0.7rem; color: #555; letter-spacing: 0.05em; min-width: 80px;
  }

  select {
    background: rgba(20,20,20,0.9); border: 1px solid #333; color: #ccc;
    padding: 4px 6px; font-family: inherit; font-size: 0.7rem;
    max-width: 190px;
  }

  /* barra del livello microfono: conferma visiva che quella sorgente capta davvero */
  #micLevelWrap {
    width: 56px; height: 9px; flex: none;
    border: 1px solid #333; background: rgba(20,20,20,0.9);
  }
  #micLevel {
    height: 100%; width: 0%; background: #4a4;
    transition: width 0.05s linear;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<video id="localVideo" autoplay playsinline muted></video>
<div id="overlay">NO SIGNAL</div>

<div id="controls">
  <!-- IP del Mac sulla rete. Da questo stesso PC va bene anche ws://localhost:8765 -->
  <input id="wsUrl" value="ws://192.168.1.7:8765" />
  <!-- <input id="wsUrl" value="ws://172.20.10.13:8765" /> -->
  <input id="questId" class="short" value="Quest-PeerId" />
  <button id="btnConnect">Connect</button>
  <button id="btnDisconnect" disabled>Disconnect</button>
  <button id="btnAudio" disabled>Audio Off</button>
  <select id="micSelect" title="Microfono da inviare al Quest"></select>
  <div id="micLevelWrap" title="Livello del microfono: parla per vederlo muovere"><div id="micLevel"></div></div>
  <span id="status">disconnected</span>
</div>

<!-- Logica in TypeScript: sorgente in src/client.ts, compilato in dist/client.js con `npm run build`.
     Script classico (non module) così si carica anche aprendo il file via file:// (Chrome blocca
     i module da file://). client.ts non ha import, quindi non serve un bundler. -->
<script src="./dist/client.js"></script>
</body>
</html>
